[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carryflow"
version = "1.0.0"
description = "PE/VC distribution waterfall, carried-interest & exit-structuring engine"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.9"
authors = [{ name = "Bhupendra Gurjar", email = "bgurjar05.bg@gmail.com" }]
keywords = ["private-equity", "venture-capital", "waterfall", "carried-interest",
            "irr", "moic", "continuation-vehicle", "secondaries", "fund-modeling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["click>=8.0"]

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
carryflow = "carryflow.cli:main"

[project.urls]
Homepage = "https://github.com/bhupendra05/carryflow"

[tool.pytest.ini_options]
testpaths = ["tests"]
